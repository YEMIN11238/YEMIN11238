<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">张俊豪的个人工作台 · 点击进入网站</title>
  <desc id="desc">自动播放的浅色终端。张俊豪制作 macOS 工具、浏览器翻译、交互网页、可复用 Skill 和小游戏，代表作品包括 Pop、万能说客 Wild Talker 和 Glass UI。点击终端进入个人网站。</desc>
  <style>
    :root { color-scheme: light; }
    .window { fill: #f8fafc; stroke: #d8e1ea; stroke-width: 2; }
    .bar { fill: #f0f4f7; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "PingFang SC", "Microsoft YaHei", monospace; }
    .meta { fill: #8a9bab; font-size: 16px; letter-spacing: .5px; }
    .heading { fill: #45586b; font-size: 25px; font-weight: 700; }
    .body { fill: #576b7d; font-size: 22px; }
    .prompt { fill: #4381c8; font-size: 22px; font-weight: 600; }
    .command { fill: #405469; font-size: 22px; }
    .ok { fill: #479c79; font-weight: 700; }
    .name { fill: #344b60; font-size: 26px; font-weight: 700; }
    .projects { fill: #4c6c8d; font-size: 23px; }
    .directions { fill: #6a7d8e; font-size: 21px; }
    .ready { fill: #479c79; font-size: 20px; font-weight: 600; }
    .cta-text { fill: #3675bb; font-size: 21px; font-weight: 600; }
    .hint { fill: #96a5b2; font-size: 14px; letter-spacing: 1px; }
    .row { animation-duration: 16s; animation-timing-function: linear; animation-iteration-count: infinite; }
    .r-title { animation-name: title-row; }
    .r-boot-one { animation-name: boot-one; }
    .r-boot-two { animation-name: boot-two; }
    .r-who { animation-name: who-row; }
    .r-name { animation-name: name-row; }
    .r-cat { animation-name: cat-row; }
    .r-projects { animation-name: projects-row; }
    .r-directions { animation-name: directions-row; }
    .r-open { animation-name: open-row; }
    .r-ready { animation-name: ready-row; }
    .r-cta { animation-name: cta-row; }
    .type-who { transform-origin: 0 0; animation: type-who 16s steps(6, end) infinite; }
    .type-cat { transform-origin: 0 0; animation: type-cat 16s steps(12, end) infinite; }
    .type-open { transform-origin: 0 0; animation: type-open 16s steps(14, end) infinite; }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    .arrow { animation: nudge 1.8s ease-in-out infinite; }
    @keyframes title-row { 0%, 1% { opacity: 0; } 3%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes boot-one { 0%, 4% { opacity: 0; } 6%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes boot-two { 0%, 7% { opacity: 0; } 9%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes who-row { 0%, 12% { opacity: 0; } 13%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes name-row { 0%, 18% { opacity: 0; } 20%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes cat-row { 0%, 23% { opacity: 0; } 24%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes projects-row { 0%, 31% { opacity: 0; } 33%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes directions-row { 0%, 34% { opacity: 0; } 36%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes open-row { 0%, 39% { opacity: 0; } 40%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes ready-row { 0%, 47% { opacity: 0; } 49%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes cta-row { 0%, 50% { opacity: 0; } 53%, 93% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes type-who { 0%, 13% { transform: scaleX(0); } 17%, 97% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes type-cat { 0%, 24% { transform: scaleX(0); } 30%, 97% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes type-open { 0%, 40% { transform: scaleX(0); } 46%, 97% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @keyframes blink { 0%, 48% { opacity: 1; } 49%, 100% { opacity: 0; } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(7px); } }
    @media (prefers-reduced-motion: reduce) {
      .row, .type-who, .type-cat, .type-open, .cursor, .arrow { animation: none; opacity: 1; transform: none; }
    }
  </style>
  <defs>
    <clipPath id="who-reveal"><rect class="type-who" x="0" y="-28" width="81" height="40"/></clipPath>
    <clipPath id="cat-reveal"><rect class="type-cat" x="0" y="-28" width="161" height="40"/></clipPath>
    <clipPath id="open-reveal"><rect class="type-open" x="0" y="-28" width="188" height="40"/></clipPath>
  </defs>
  <rect class="window" x="1" y="1" width="1198" height="648" rx="19"/>
  <path class="bar" d="M20 2h1160a18 18 0 0 1 18 18v39H2V20A18 18 0 0 1 20 2z"/>
  <path d="M2 60h1196" stroke="#d8e1ea"/>
  <circle cx="31" cy="31" r="8" fill="#ef6864"/>
  <circle cx="59" cy="31" r="8" fill="#efbf55"/>
  <circle cx="87" cy="31" r="8" fill="#54b879"/>
  <text class="mono meta" x="600" y="37" text-anchor="middle">junhao@studio — 张俊豪 — 100×30</text>
  <g class="mono">
    <text class="heading row r-title" x="60" y="112">Junhao OS v1.0 · Personal Workspace</text>
    <text class="body row r-boot-one" x="60" y="157">[ <tspan class="ok">OK</tspan> ] 载入 macOS 工具与浏览器扩展</text>
    <text class="body row r-boot-two" x="60" y="194">[ <tspan class="ok">OK</tspan> ] 载入交互网页、可复用 Skill 与小游戏</text>

    <g class="row r-who">
      <text class="prompt" x="60" y="247">junhao@studio ~ %</text>
      <g transform="translate(307 247)"><text class="command" clip-path="url(#who-reveal)">whoami</text></g>
    </g>
    <text class="name row r-name" x="60" y="285">张俊豪</text>

    <g class="row r-cat">
      <text class="prompt" x="60" y="338">junhao@studio ~ %</text>
      <g transform="translate(307 338)"><text class="command" clip-path="url(#cat-reveal)">cat about.md</text></g>
    </g>
    <text class="projects row r-projects" x="60" y="377">Pop / 万能说客 Wild Talker / Glass UI</text>
    <text class="directions row r-directions" x="60" y="413">macOS 工具 · 浏览器翻译 · 交互网页 · Skill · 小游戏</text>

    <g class="row r-open">
      <text class="prompt" x="60" y="467">junhao@studio ~ %</text>
      <g transform="translate(307 467)"><text class="command" clip-path="url(#open-reveal)">open junhao.os</text></g>
    </g>
    <g class="row r-ready">
      <text class="ready" x="60" y="507">WORKSPACE READY <tspan class="cursor">▌</tspan></text>
      <text class="hint" x="1139" y="507" text-anchor="end">EXPLORE THE PROJECTS</text>
    </g>

    <g class="row r-cta">
      <rect x="60" y="548" width="1080" height="58" rx="12" fill="#edf4fb" stroke="#d6e5f4"/>
      <text class="cta-text" x="600" y="585" text-anchor="middle">点击终端，进入张俊豪的个人网站</text>
      <g class="arrow"><text class="cta-text" x="1085" y="585">→</text></g>
    </g>
  </g>
</svg>
